# Railway service config for the ingest worker.
# In the Railway dashboard set this service's Root Directory to `worker` so this
# file and the Dockerfile are picked up.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# No HTTP server here - it is a background consumer, so let Railway restart it
# if it ever exits.
restartPolicyType = "always"
restartPolicyMaxRetries = 10
numReplicas = 1
